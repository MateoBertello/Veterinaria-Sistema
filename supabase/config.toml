[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

# Fixture de volumen del Módulo Comercial (C8·T1): 3 tenants sintéticos con
# productos, lotes, movimientos y ventas suficientes para que los reportes
# tengan qué reportar y para que EXPLAIN elija índices. Se aplica acá, en el
# `supabase db reset`, y no desde un test: escribe directo en `auth.users`, lo
# que exige el rol postgres —no alcanza la service-role key—, y de este modo la
# suite de integración no necesita ni docker ni el nombre del contenedor.
# Ver tests/README.md § "El fixture de volumen".
[db.seed]
enabled = true
sql_paths = ["./seed.sql", "./seeds/comercial_volumen_seed.sql"]

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"
openai_api_key = "env(OPENAI_API_KEY)"

[inbucket]
enabled = true
port = 54324
smtp_port = 54325
pop3_port = 54326

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://127.0.0.1:3000"
additional_redirect_urls = ["https://127.0.0.1:3000"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = false
enable_manual_linking = false

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false

[functions.api]
verify_jwt = false
